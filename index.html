<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06111d">
  <meta name="description" content="Willkommen im Gast-WLAN von Le Cercle Privé.">
  <title>Le Cercle Privé – Willkommen</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: #06111d; }
    body { min-height: 100svh; overflow: hidden; }
    main { width: 100%; height: 100%; height: 100svh; display: grid; place-items: center; }
    img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    @media (min-aspect-ratio: 1/1) {
      img { object-fit: contain; }
    }
  </style>
</head>
<body>
  <main aria-label="Begrüßung Le Cercle Privé">
    <img src="welcome.png" alt="Willkommen im Gast-WLAN von Le Cercle Privé">
  </main>
</body>
</html>
